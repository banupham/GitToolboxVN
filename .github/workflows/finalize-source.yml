name: Finalize GitToolboxVN source
on:
  push:
    paths:
      - '.source_parts/**'
      - '.github/workflows/finalize-source.yml'
permissions:
  contents: write
jobs:
  finalize:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Restore exact C++ source and clean transfer files
        shell: bash
        run: |
          set -euo pipefail
          cat .source_parts/cpp01.b64 .source_parts/cpp02.b64 | base64 -d | gzip -d > GitToolboxVN.cpp
          echo '9646821c9a2c27097fe88c746858f2f8ab0064ed6ce27b3470ca0d43c68564d5  GitToolboxVN.cpp' | sha256sum -c -
          rm -rf .source_parts .github
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'Finalize GitToolboxVN v1.3 source'
          git push
